name: Set up LinguPlay source
description: >
  Check out the PRIVATE LinguPlay source into ./source, install Node and the
  npm dependencies, and stamp the release version into the manifests.
  Every build job in this repository starts with this action, so there is
  exactly one definition of "where the code comes from".

inputs:
  source-ref:
    description: Branch, tag, or commit in linguplay/Linguplay to build.
    required: true
  version:
    description: Semantic version WITHOUT a leading v, e.g. 0.3.0.
    required: true
  deploy-key:
    description: >
      SSH private key with read access to the private source repository.
      Pass secrets.SOURCE_DEPLOY_KEY — composite actions cannot read secrets
      on their own.
    required: true
  node-version:
    description: Node version to install.
    required: false
    default: '22.22'

runs:
  using: composite
  steps:
    # persist-credentials: false keeps the deploy key out of the checked-out
    # .git config, so later steps (and any third-party action) cannot reuse it
    # to reach the private repository.
    - name: Check out private LinguPlay source
      uses: actions/checkout@v5
      with:
        repository: linguplay/Linguplay
        ref: ${{ inputs.source-ref }}
        ssh-key: ${{ inputs.deploy-key }}
        persist-credentials: false
        path: source

    - name: Validate client configuration
      uses: ./source/.github/actions/validate-client-config

    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: source/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: source
      run: npm ci

    # Tauri derives the Android versionCode and the desktop installer version
    # from tauri.conf.json, so both manifests must carry the release version
    # before any platform builds.
    - name: Stamp release version
      shell: bash
      working-directory: source
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        node -e '
          const fs = require("fs");
          const file = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          config.version = process.env.RELEASE_VERSION;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
        '
        npm pkg set "version=$RELEASE_VERSION"
        echo "Building LinguPlay $RELEASE_VERSION from ${{ inputs.source-ref }}"
