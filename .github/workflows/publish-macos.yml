name: Publish macOS DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: 0.2.0
        type: string
      source_ref:
        description: Private source branch, tag, or commit
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: linguplay-macos-release
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_PUBLIC_SITE_URL: https://linguplay-2uj.pages.dev

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Validate release input
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a semantic version without a leading v."
            exit 1
          fi

      - name: Check out private LinguPlay source
        uses: actions/checkout@v5
        with:
          repository: linguplay/Linguplay
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - uses: ./source/.github/actions/validate-client-config

      - name: Install VLC
        run: brew install --cask vlc

      - uses: actions/setup-node@v5
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Quality gate
        working-directory: source
        run: npm run typecheck && npm run lint && npm test

      - name: Set release version
        working-directory: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '
          npm pkg set "version=$RELEASE_VERSION"

      - name: Build application
        working-directory: source
        run: npm run tauri build -- --features nativeplayer --bundles app

      - name: Bundle libVLC and create DMG
        working-directory: source
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/LinguPlay.app"
          VLCMAC="/Applications/VLC.app/Contents/MacOS"
          BIN="$APP/Contents/MacOS/LinguPlay"

          mkdir -p "$APP/Contents/MacOS/lib" "$APP/Contents/MacOS/plugins"
          cp -R "$VLCMAC/lib/." "$APP/Contents/MacOS/lib/"
          cp -R "$VLCMAC/plugins/." "$APP/Contents/MacOS/plugins/"

          old_reference=$(otool -L "$BIN" |
            awk '/libvlc\.dylib/ { print $1; exit }')
          if [ -n "${old_reference:-}" ]; then
            install_name_tool -change \
              "$old_reference" @rpath/libvlc.dylib "$BIN"
          fi

          codesign --force --deep --sign - "$APP"
          mkdir -p out
          hdiutil create -volname "LinguPlay" -srcfolder "$APP" \
            -ov -format UDZO "out/LinguPlay_native_arm64.dmg"
          shasum -a 256 "out/LinguPlay_native_arm64.dmg" \
            > "out/LinguPlay_native_arm64.dmg.sha256"
          hdiutil verify "out/LinguPlay_native_arm64.dmg"

      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ inputs.version }}
          name: LinguPlay v${{ inputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            Official LinguPlay installer.

            - macOS: Apple Silicon
            - Download `LinguPlay_native_arm64.dmg`

            This early build is ad-hoc signed but not yet notarized by Apple.
          files: |
            source/out/LinguPlay_native_arm64.dmg
            source/out/LinguPlay_native_arm64.dmg.sha256
